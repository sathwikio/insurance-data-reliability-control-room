name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python deps
        run: |
          pip install -U pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests (no Spark, no key)
        run: python -m pytest tests/ -q -k "not spark and not delta" --cov=src --cov-report=term-missing
      - name: Validate checked-in artifacts
        run: python -m pytest tests/test_decisions.py tests/test_generation.py tests/test_metrics.py -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: cd web && npm ci
      - name: Typecheck
        run: cd web && npx tsc --noEmit
      - name: Build
        run: cd web && npm run build
